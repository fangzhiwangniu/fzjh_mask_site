<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面具图鉴</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --panel: #151b26;
      --panel-2: #1b2330;
      --text: #e6e9ef;
      --muted: #9aa4b2;
      --accent: #7c9eff;
      --accent-2: #79e0c1;
      --border: #2a3240;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    header {
      padding: 40px 24px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
    p.lead { margin: 0 0 28px; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-bottom: 28px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 15px;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .stat b { display: block; font-size: 26px; color: var(--accent); }
    .stat span { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }
    .mask-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform .15s ease, border-color .15s ease;
    }
    .mask-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .image-wrap {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8d5b3;
      position: relative;
      overflow: hidden;
    }
    .image-wrap .mask-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
    }
    .image-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .image-wrap canvas.ready { opacity: 1; }
    .image-wrap.dynamic-active.image-backdrop {
      background-image: var(--mask-bg);
      background-size: cover;
      background-position: center;
    }
    .image-wrap.dynamic-active .mask-image { opacity: 0; }
    .image-wrap.dynamic-active.canvas-failed .mask-image { opacity: 1; }
    .border-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 8px rgba(0, 0, 0, .35));
    }
    .selectors { display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
    .chip-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip.active {
      color: #10141c;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .image-fallback {
      font-size: 48px;
      opacity: .55;
    }
    .image-wrap.missing { background: repeating-linear-gradient(45deg,#202a38,#202a38 12px,#243040 12px,#243040 24px); }
    .card-body { padding: 14px; }
    .mask-name { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .mask-id { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .point {
      display: inline-block;
      background: rgba(121,224,193,.12);
      color: var(--accent-2);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .achievement-name { font-size: 14px; margin: 0 0 10px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .tag {
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
    }
    details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    summary { cursor: pointer; }
    .empty { color: var(--muted); text-align: center; padding: 40px; }
    .pagination-wrap {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 8px;
    }
    .pagination-button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease;
    }
    .pagination-button:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
    }
    .pagination-button.active {
      color: #10141c;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .pagination-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .pagination-info {
      color: var(--muted);
      font-size: 12px;
      padding: 0 6px;
    }
    @media (max-width: 700px) {
      .controls { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>面具图鉴</h1>
    <p class="lead">按面具 ID、名称或成就搜索。</p>
    <div class="controls">
      <input id="search" placeholder="搜索名称 / ID / 成就">
      <select id="type-filter">
        <option value="">全部类型</option>
        <option value="1">戏曲面具</option>
        <option value="2">时间/百花焕颜</option>
      </select>
      <select id="sort">
        <option value="id">按 ID</option>
        <option value="point">按成就点数</option>
        <option value="level">按等级数</option>
        <option value="cailiao">按分解材料</option>
      </select>
    </div>
    <div id="stats" class="stats"></div>
  </header>
  <main id="grid" class="grid">
    <div class="empty">输入关键词或选择筛选后显示面具</div>
  </main>
  <script src="./vendor/spine-webgl.js"></script>
  <script>
    window.imageFallback = element => {
      element.closest(".image-wrap").classList.add("missing");
      element.outerHTML = '<div class="image-fallback">🎭</div>';
    };
    window.borderFallback = element => element.remove();
    const DEFAULT_PAGE_SIZE = 24;
    const state = {
      masks: [], query: "", type: "", sort: "id", selections: {},
      page: 1
    };
    const grid = document.getElementById("grid");
    const statsEl = document.getElementById("stats");

    function pointOf(mask) {
      return mask.directAchievements.reduce((sum, item) => sum + item.point, 0);
    }

    function tag(text) {
      return `<span class="tag">${text}</span>`;
    }

    function achievementList(mask) {
      const direct = mask.directAchievements.map(item => `${item.name} · ${item.point}`).join("、");
      const combo = mask.combinedAchievements.map(item => `${item.name} · ${item.point}`).join("、");
      return direct + (combo ? `<br><small>组合成就：${combo}</small>` : "");
    }

    function selectedLevel(mask) {
      if (!mask.levels?.length) return null;
      const wanted = state.selections[mask.maskId]?.level;
      if (wanted) {
        const selected = mask.levels.find(item => item.level === wanted);
        if (selected) return selected;
      }
      return [...mask.levels].reverse().find(item => item.arts.some(art => art.anim))
        || mask.levels[mask.levels.length - 1];
    }

    function selectedArt(level, maskId) {
      if (!level?.arts?.length) return null;
      const wanted = state.selections[maskId]?.art;
      return level.arts.find(item => item.id === wanted)
        || level.arts.find(item => item.anim)
        || level.arts[0];
    }

    function chipRow(items, activeValue, kind, maskId) {
      if (items.length < 2) return "";
      const chips = items.map(item => `
        <button class="chip${item.value === activeValue ? " active" : ""}"
                data-kind="${kind}" data-mask-id="${maskId}" data-value="${item.value}">
          ${item.label}
        </button>`).join("");
      return `<div class="chip-row">${chips}</div>`;
    }

    function maskCard(mask) {
      const level = selectedLevel(mask);
      const art = selectedArt(level, mask.maskId);
      const image = art?.image || mask.image;
      const isDynamic = Boolean(art?.anim && spineSupported);
      const useImageBackdrop = isDynamic && Boolean(art?.useImageBackdrop);
      const wrapClass = [
        "image-wrap",
        isDynamic && "dynamic-active",
        useImageBackdrop && "image-backdrop"
      ].filter(Boolean).join(" ");
      const wrapStyle = useImageBackdrop && image ? ` style="--mask-bg:url('./${image}')"` : "";
      const imageHtml = image
        ? `<img class="mask-image" src="./${image}" alt="${mask.name}" loading="lazy" decoding="async" onerror="imageFallback(this)">`
        : `<div class="image-fallback">🎭</div>`;
      const borderHtml = art?.borderImage
        ? `<img class="border-overlay" src="./${art.borderImage}" alt="${mask.name} 边框" decoding="async" onerror="borderFallback(this)">`
        : "";
      const levelChips = chipRow(
        mask.levels.map(item => ({ value: item.level, label: `Lv.${item.level}` })),
        level?.level, "level", mask.maskId
      );
      const artChips = chipRow(
        (level?.arts || []).map(item => ({ value: item.id, label: `形态 ${item.id}` })),
        art?.id, "art", mask.maskId
      );
      const dynamicCanvas = art?.anim ? `
        <canvas class="spine-canvas" width="256" height="256"
                data-folder="${art.animFolder}" data-anim="${art.anim}"></canvas>` : "";
      const selectors = levelChips || artChips
        ? `<div class="selectors">${levelChips}${artChips}</div>` : "";
      const dealText = mask.canDeal ? `分解 ${mask.cailiao} 材料` : "不可分解";
      const tags = [
        tag(mask.maskType === "1" ? "戏曲面具" : "时间/百花焕颜"),
        tag(`等级 ${mask.levelCount}`),
        tag(mask.canUpgrade ? "可升级" : "不可升级"),
        tag(dealText)
      ].join("");
      return `
        <article class="mask-card">
          <div class="${wrapClass}"${wrapStyle}>
            ${imageHtml}
            ${dynamicCanvas}
            ${borderHtml}
          </div>
          <div class="card-body">
            <h2 class="mask-name">${mask.name}</h2>
            <div class="mask-id">${mask.maskId}</div>
            <div class="point">成就点数 ${pointOf(mask)}</div>
            <div class="achievement-name">${achievementList(mask)}</div>
            ${selectors}
            <div class="tags">${tags}</div>
            <details><summary>描述</summary>${art?.desc ?? mask.desc ?? "暂无描述"}</details>
          </div>
        </article>`;
    }

    function filteredMasks() {
      const query = state.query.toLowerCase();
      let masks = state.masks.filter(mask => {
        const text = [
          mask.name, mask.maskId, mask.desc,
          ...mask.levels.flatMap(level => level.arts.map(art => art.desc)),
          ...mask.directAchievements.map(item => item.name),
          ...mask.combinedAchievements.map(item => item.name)
        ].join(" ").toLowerCase();
        return text.includes(query) && (!state.type || mask.maskType === state.type);
      });
      if (state.sort === "point") masks = masks.sort((a, b) => pointOf(b) - pointOf(a));
      if (state.sort === "level") masks = masks.sort((a, b) => b.levelCount - a.levelCount);
      if (state.sort === "cailiao") masks = masks.sort((a, b) => Number(b.cailiao || 0) - Number(a.cailiao || 0) || Number(a.maskId.replace("mianju", "")) - Number(b.maskId.replace("mianju", "")));
      if (state.sort === "id") masks = masks.sort((a, b) => Number(a.maskId.replace("mianju", "")) - Number(b.maskId.replace("mianju", "")));
      return masks;
    }

    function hasActiveCriteria() {
      return Boolean(state.query.trim() || state.type || state.sort !== "id");
    }

    function pageNumbers(current, total) {
      if (total <= 7) return Array.from({ length: total }, (_, index) => index + 1);
      const pages = new Set([1, 2, current - 1, current, current + 1, total - 1, total]);
      const ordered = [...pages].filter(page => page >= 1 && page <= total).sort((a, b) => a - b);
      return ordered.flatMap((page, index) => {
        const previous = ordered[index - 1];
        return previous && page - previous > 1 ? ["...", page] : [page];
      });
    }

    function paginationHtml(totalPages) {
      if (totalPages <= 1) return "";
      const buttons = pageNumbers(state.page, totalPages).map(page => page === "..."
        ? `<span class="pagination-info">…</span>`
        : `<button class="pagination-button${page === state.page ? " active" : ""}"
                 data-page="${page}">${page}</button>`
      ).join("");
      return `
        <div class="pagination-wrap">
          <button class="pagination-button" data-page="${state.page - 1}"${state.page <= 1 ? " disabled" : ""}>上一页</button>
          ${buttons}
          <button class="pagination-button" data-page="${state.page + 1}"${state.page >= totalPages ? " disabled" : ""}>下一页</button>
        </div>`;
    }

    function render() {
      if (!hasActiveCriteria()) {
        state.page = 1;
        grid.innerHTML = `<div class="empty">输入关键词或选择筛选后显示面具</div>`;
        observeSpineCanvases();
        return;
      }

      const masks = filteredMasks();
      const totalPages = Math.max(1, Math.ceil(masks.length / DEFAULT_PAGE_SIZE));
      state.page = Math.min(Math.max(state.page, 1), totalPages);
      const start = (state.page - 1) * DEFAULT_PAGE_SIZE;
      const pageMasks = masks.slice(start, start + DEFAULT_PAGE_SIZE);
      grid.innerHTML = pageMasks.map(maskCard).join("") || `<div class="empty">没有匹配的面具</div>`;
      grid.insertAdjacentHTML("beforeend", paginationHtml(totalPages));
      observeSpineCanvases();
    }

    fetch("./mask_data.json", { cache: "no-store" })
      .then(response => response.json())
      .then(data => {
        state.masks = data.masks;
        const stats = data.stats;
        statsEl.innerHTML = `
          <div class="stat"><b>${stats.masks}</b><span>面具数</span></div>
          <div class="stat"><b>${stats.achievements}</b><span>面具成就</span></div>
          <div class="stat"><b>${state.masks.filter(mask => mask.canDeal).length}</b><span>可分解</span></div>
          <div class="stat"><b>${stats.dynamic || 0}</b><span>动态面具</span></div>`;
        render();
      });

    document.getElementById("search").addEventListener("input", event => {
      state.query = event.target.value;
      state.page = 1;
      render();
    });
    document.getElementById("type-filter").addEventListener("change", event => {
      state.type = event.target.value;
      state.page = 1;
      render();
    });
    document.getElementById("sort").addEventListener("change", event => {
      state.sort = event.target.value;
      state.page = 1;
      render();
    });

    grid.addEventListener("click", event => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      const maskId = chip.dataset.maskId;
      state.selections[maskId] ??= {};
      if (chip.dataset.kind === "level") {
        state.selections[maskId].level = Number(chip.dataset.value);
        delete state.selections[maskId].art;
      } else {
        state.selections[maskId].art = chip.dataset.value;
      }
      render();
    });

    grid.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (!button || button.disabled) return;
      const page = Number(button.dataset.page);
      if (!Number.isFinite(page) || page === state.page) return;
      state.page = page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    const spineCache = new Map();
    const activeSpineCanvases = new Set();
    const sharedCanvas = document.createElement("canvas");
    sharedCanvas.width = 256;
    sharedCanvas.height = 256;
    let sharedRenderer = null;
    let spineSupported = typeof spine !== "undefined";
    function observeSpineCanvases() {
      if (!spineSupported) return;
      refreshActiveSpineCanvases();
    }

    function refreshActiveSpineCanvases() {
      if (!spineSupported) return;
      const margin = 120;
      const viewportHeight = window.innerHeight;
      for (const canvas of grid.querySelectorAll(".spine-canvas")) {
        const rect = canvas.getBoundingClientRect();
        const visible = rect.bottom > -margin && rect.top < viewportHeight + margin;
        if (visible) activeSpineCanvases.add(canvas);
        else activeSpineCanvases.delete(canvas);
      }
    }

    let spineRefreshQueued = false;
    function queueSpineRefresh() {
      if (spineRefreshQueued) return;
      spineRefreshQueued = true;
      requestAnimationFrame(() => {
        spineRefreshQueued = false;
        refreshActiveSpineCanvases();
      });
    }

    function waitForAssets(assetManager) {
      return new Promise((resolve, reject) => {
        const timer = setInterval(() => {
          if (assetManager.toLoad > 0) return;
          clearInterval(timer);
          const errors = Object.values(assetManager.errors);
          if (errors.length) reject(new Error(errors.join("; ")));
          else resolve();
        }, 40);
      });
    }

    async function loadSpineData(folder) {
      if (spineCache.has(folder)) return spineCache.get(folder);
      const promise = (async () => {
        if (!sharedRenderer) sharedRenderer = new spine.webgl.SceneRenderer(sharedCanvas, sharedCanvas);
        const pathPrefix = `./Anim/portrait/maskV3/${folder}/`;
        const assetManager = new spine.webgl.AssetManager(sharedRenderer.context, pathPrefix);
        assetManager.loadTextureAtlas("skeleton.atlas");
        await waitForAssets(assetManager);
        const atlas = assetManager.get("skeleton.atlas");
        const attachmentLoader = new spine.AtlasAttachmentLoader(atlas);
        let data;
        let lastError = new Error("未找到骨骼数据");
        for (const name of ["skeleton.skel", "skeleton.json"]) {
          const response = await fetch(pathPrefix + name);
          if (!response.ok) {
            lastError = new Error(`${name} 请求失败：${response.status}`);
            continue;
          }
          try {
            const buffer = await response.arrayBuffer();
            const isJsonSkeleton = buffer.byteLength && new Uint8Array(buffer, 0, 1)[0] === 0x7b;
            data = isJsonSkeleton
              ? new spine.SkeletonJson(attachmentLoader).readSkeletonData(new TextDecoder().decode(buffer))
              : new spine.SkeletonBinary(attachmentLoader).readSkeletonData(new Uint8Array(buffer));
            break;
          } catch (error) {
            data = null;
            lastError = error;
          }
        }
        if (!data) throw lastError;
        return data;
      })();
      spineCache.set(folder, promise);
      promise.catch(() => spineCache.delete(folder));
      return promise;
    }

    function prepareCanvas(canvas) {
      const folder = canvas.dataset.folder;
      const animationName = canvas.dataset.anim;
      return loadSpineData(folder).then(data => {
        if (!canvas.isConnected) return;
        const skeleton = new spine.Skeleton(data);
        const state = new spine.AnimationState(new spine.AnimationStateData(data));
        state.setAnimation(0, animationName, true);
        canvas._spine = { skeleton, state };
        canvas.classList.add("ready");
      }).catch(error => {
        canvas.dataset.failed = "1";
        canvas.classList.add("failed");
        canvas.closest(".image-wrap")?.classList.add("canvas-failed");
        console.warn("动态面具加载失败：", error);
      });
    }

    function renderSpine(delta) {
      if (!spineSupported) return;
      if (!sharedRenderer) sharedRenderer = new spine.webgl.SceneRenderer(sharedCanvas, sharedCanvas);
      const gl = sharedRenderer.context.gl;
      for (const canvas of [...activeSpineCanvases]) {
        if (!canvas.isConnected) {
          activeSpineCanvases.delete(canvas);
          continue;
        }
        if (!canvas._spine) {
          if (!canvas.dataset.failed && !canvas._spineLoading) {
            canvas._spineLoading = true;
            prepareCanvas(canvas);
          }
          continue;
        }
        const view = canvas._spine;
        view.state.update(delta);
        view.state.apply(view.skeleton);
        view.skeleton.updateWorldTransform();
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        sharedRenderer.begin();
        sharedRenderer.drawSkeleton(view.skeleton, false);
        sharedRenderer.end();
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(sharedCanvas, 0, 0);
      }
    }

    let previousTime = performance.now();
    function animationLoop(now) {
      const delta = Math.min((now - previousTime) / 1000, 1 / 15);
      previousTime = now;
      renderSpine(delta);
      requestAnimationFrame(animationLoop);
    }

    if (spineSupported) {
      requestAnimationFrame(animationLoop);
    } else {
      console.warn("Spine runtime 未加载，动态面具将显示静态图。");
    }
    window.addEventListener("scroll", queueSpineRefresh, { passive: true });
    window.addEventListener("resize", queueSpineRefresh, { passive: true });
  </script>
</body>
</html>
